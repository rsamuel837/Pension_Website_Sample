<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Pension Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="header">
        <h1>Secure Pension Portal</h1>
        <p>Access your retirement savings</p>
    </header>

    <main class="container">
        <h2>Member Login</h2>

        <form>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <button type="button">Login</button>
        </form>

        <div class="footer-text">
            Forgot your username or password?
        </div>

        <div class="disclaimer">
            This is a demo pension website. No data is stored or transmitted.
        </div>
    </main>

    <!-- Main JS -->
    <script src="js/main.js"></script>

    <!-- Salesforce Embedded Messaging -->
    <script src="js/salesforce-chat.js"></script>

</body>
</html>
